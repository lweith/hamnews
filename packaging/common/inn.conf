##  hamnews: minimal INN for ham-radio usenet. See inn.conf(5) for every key;
##  anything not set here uses INN's compiled default.

# ---- This station. Set both to your callsign, lowercase (e.g. kn6fln). -------
# pathhost goes into every article's Path: header; domain into Message-IDs.
# They must be unique on the net. hamnews will not start while these say CHANGEME.
pathhost:       CHANGEME
domain:         CHANGEME

# ---- Listening. Loopback only by default. To let LAN machines read, set a LAN
# address and add them in readers.conf. Anyone who can post makes this station
# transmit under your callsign.
bindaddress:    127.0.0.1
bindaddress6:   "::1"
server:         localhost
port:           119

# ---- Behaviour
mta:            "/bin/true %s"
ovmethod:       tradindexed
hismethod:      hisv6
enableoverview: true
pgpverify:      false
# No Cancel-Lock in this build: without this, cancels are stored but never done.
docancels:      auth
# Articles older than this many days are refused (the exchange window is 14).
artcutoff:      30

# ---- Paths (package layout; don't change)
pathnews:       /usr/lib/hamnews
pathbin:        /usr/lib/hamnews/bin
pathcontrol:    /usr/lib/hamnews/bin/control
pathfilter:     /usr/lib/hamnews/bin/filter
pathhttp:       /usr/lib/hamnews/http
pathetc:        /etc/hamnews
pathdb:         /var/lib/hamnews
pathlog:        /var/log/hamnews
pathrun:        /run/hamnews
pathspool:      /var/spool/hamnews
patharchive:    /var/spool/hamnews/archive
patharticles:   /var/spool/hamnews/articles
pathincoming:   /var/spool/hamnews/incoming
pathoutgoing:   /var/spool/hamnews/outgoing
pathoverview:   /var/spool/hamnews/overview
pathtmp:        /var/spool/hamnews/tmp
