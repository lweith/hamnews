# airtime settings. After editing: systemctl restart airtime
# (environment-file syntax: KEY=value, no spaces around '=')

# direwolf's AGW port (AGWPORT in direwolf.conf; default 8000).
AGW=127.0.0.1:8000

# Page, /api/stats and Prometheus /metrics. Read-only, so a LAN address is fine
# if Prometheus scrapes from another machine.
HTTP=127.0.0.1:8075

# For airtime estimates: channel bit rate, and direwolf's TXDELAY.
BITRATE=1200
TXDELAY=300ms

# Anything else, e.g. a packet trace for Wireshark (the directory must exist and
# be writable: StateDirectory gives /var/lib/airtime):
#   OPTS=-pcap /var/lib/airtime/trace.pcap
OPTS=
