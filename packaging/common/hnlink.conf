# hnlink settings. After editing: systemctl restart hnlink
# (environment-file syntax: KEY=value, no spaces around '=')

# Your callsign with an SSID that nothing else on this TNC uses (Winlink, APRS),
# e.g. KN6FLN-5. hnlink does not run until this is set.
CALL=

# From: line for posts made on the status page, e.g. KN6FLN <you@example.com>
# Empty means the bare callsign.
FROM=

# The TNC: direwolf's KISS TCP port, or a hardware TNC in KISS mode on a serial
# port, e.g. KISS=/dev/ttyUSB0:9600 (baud defaults to 9600). For a serial port the
# sandbox has to let hnlink see it: systemctl edit hnlink, and add
#   [Service]
#   PrivateDevices=no
#   DeviceAllow=/dev/ttyUSB0 rw
#   SupplementaryGroups=uucp        (Arch; dialout on Debian/Ubuntu/Pi OS)
# A serial TNC belongs to hnlink alone; to share one radio with Winlink, use direwolf.
KISS=127.0.0.1:8001

# The news server.
NNTP=localhost:119

# Status/posting page. Empty disables it. Keep it on localhost: anything posted
# there is transmitted under your callsign.
HTTP=127.0.0.1:8073

# Anything else, e.g. for 9600 baud: --bitrate 9600 --symsize 448
# See hnlink run -h and /usr/share/doc/hnlink/README.md.
OPTS=
